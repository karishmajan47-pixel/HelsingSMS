name: Build HelsingSMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Official Gradle action - automatically handles the wrapper and Gradle version
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # Force generation of the Gradle wrapper and build
    - name: Build Debug APK
      run: |
        gradle wrapper
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HelsingSMS-APK
        path: app/build/outputs/apk/debug/app-debug.apk
