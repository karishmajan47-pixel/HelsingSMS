name: Build HelsingSMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # This community action automatically sets up Gradle and fixes permissions
    - name: Build APK
      uses: vgaidarji/android-github-actions-build@v1.0.2
      with:
        build-command: 'assembleDebug'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HelsingSMS-APK
        path: app/build/outputs/apk/debug/app-debug.apk
