name: Build HelsingSMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Force Gradle to use version 8.7 (bypasses the system's Gradle 9)
    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Build Debug APK
      run: gradle wrapper && gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HelsingSMS-APK
        path: app/build/outputs/apk/debug/app-debug.apk
